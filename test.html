<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <title>サンプル</title>
        <meta name="description" content="サンプルです" />
        <!-- <link href="style.css" rel="stylesheet" /> -->
        <!-- MapLibre -->
        <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
        <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    </head>
    <body>
        <div id="map"></div>

        <style>
          body {
    margin: 0;
    padding: 0;
}
#map {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 100%;
}
        </style>

  <script>
    const style = {
    version: 8,
    sources: {
        rtile: {
            type: 'raster',
            tiles: ['https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: "地図の出典：<a href='https://www.gsi.go.jp/' target='_blank'>地理院タイル</a>",
        },
        plateau: {
            type: 'vector',
            tiles: ['http://localhost:8787/api/mvts/patterns_tile/{z}/{x}/{y}/mvt.pbf'],
            minzoom: 14,
            maxzoom: 14,
            
            attribution:
                "データの出典：<a href='https://github.com/indigo-lab/plateau-tokyo23ku-building-mvt-2020'>plateau-tokyo23ku-building-mvt-2020 by indigo-lab</a> (<a href='https://www.mlit.go.jp/plateau/'>国土交通省 Project PLATEAU</a> のデータを加工して作成)",
        },
    },
    layers: [
        {
            id: 'rtile',
            type: 'raster',
            source: 'rtile',
            minzoom: 5,
            maxzoom: 20,
        },
        {
            id: 'bldg',
            type: 'fill-extrusion',
            source: 'plateau',
            'source-layer': 'bldg',
            minzoom: 10,
            maxzoom: 20,
            paint: {
                'fill-extrusion-color': '#797979',
                'fill-extrusion-height': ['get', 'measuredHeight'],
            },
        },
    ],
};
var map = new maplibregl.Map({
    container: 'map',
    style: style, // 地図のスタイル
    center: [139.745461, 35.65856], // 中心座標
    zoom: 14, // ズームレベル
    pitch: 45, // 傾き
});

  </script>
    </body>
</html>
